// Detect flavors from the task name.
def taskName = getGradle().getStartParameter().getTaskRequests().toString().toLowerCase()
def isFdroid = taskName.contains('fdroid')
def isBeta = taskName.contains('beta')

apply plugin: 'com.android.library'

// Zadržavamo samo osnovnu konfiguraciju, uklonjeni su signing i permission-checker jer su za APK
apply from: "${projectDir}/../groovy/common-config.gradle"

import com.android.build.api.variant.BuildConfigField
import com.android.build.api.variant.ResValue

def getCommitMessage() {
    return run(['git', '--no-pager', 'show', '-s', '--format=%s%n%n%b', 'HEAD']).trim()
}

android {
    namespace = 'app.organicmaps'

    enableKotlin = true

    buildFeatures {
        dataBinding = true
        buildConfig = true
        resValues = true
    }

    defaultConfig {
        buildConfigField 'String', 'VERSION_NAME', '"1.0.0"'
        buildConfigField 'int', 'VERSION_CODE', '1'
        buildConfigField 'String', 'APPLICATION_ID', '"app.organicmaps"'
        buildConfigField 'String', 'SUPPORT_MAIL', '"android@organicmaps.app"'
        buildConfigField 'String', 'REVIEW_URL', '""'

        if (project.hasProperty('supportedLocalizations')) {
            resourceConfigurations += [project.ext.supportedLocalizations]
        }

        ndk.debugSymbolLevel = 'full'
    }

    flavorDimensions += 'default'

    productFlavors {
        google {
            dimension 'default'
            buildConfigField 'String', 'SUPPORT_MAIL', '"googleplay@organicmaps.app"'
            buildConfigField 'String', 'REVIEW_URL', '"market://details?id=app.organicmaps"'
        }

        web {
            dimension 'default'
            buildConfigField 'String', 'SUPPORT_MAIL', '"apk@organicmaps.app"'
        }

        fdroid {
            dimension 'default'
            buildConfigField 'String', 'SUPPORT_MAIL', '"fdroid@organicmaps.app"'
        }

        huawei {
            dimension 'default'
            buildConfigField 'String', 'SUPPORT_MAIL', '"huawei@organicmaps.app"'
            buildConfigField 'String', 'REVIEW_URL', '"appmarket://details?id=app.organicmaps"'
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
        }

        release {
            minifyEnabled true
            // shrinkResources nije dozvoljen u Android bibliotekama
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        beta {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        profileable {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.DS_Store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress = ['png', 'mwm', 'ttf', 'packed_polygons.bin']
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
    }
}

dependencies {
    api project(':libs:api')
    api project(':libs:branding')
    api project(':libs:downloader')
    api project(':libs:car')
    api project(':libs:googleassistant')
    api project(':libs:routing')
    api project(':libs:utils')

    api project(':sdk')
    api project(':sdk:car')
    api project(':sdk:widgets:lanes')
    api project(':sdk:widgets:speedlimit')

    // World maps
    googleApi project(':sdk:maps:world')
    huaweiApi project(':sdk:maps:world')

    webApi project(':sdk:location:gms:google')
    googleApi project(':sdk:location:gms:google')
    huaweiApi project(':sdk:location:gms:google')
    fdroidApi project(':sdk:location:gms:foss')

    api project(':sdk:wear:core')
    googleApi project(':sdk:wear:gms')

    coreLibraryDesugaring libs.android.tools.desugaring

    implementation libs.androidx.core
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.car.app
    implementation libs.androidx.car.app.projected
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.work
    implementation libs.androidx.lifecycle
    implementation libs.google.material
    implementation libs.devnullorthrow.mpandroidchart

    testImplementation libs.androidx.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.inline
}

androidComponents {
    // Keep debug symbols in local debug builds for native debugging.
    if (!rootProject.ext.has('CI') || !rootProject.ext.CI) {
        onVariants(selector().withBuildType("debug")) { variant ->
            variant.packaging.jniLibs.keepDebugSymbols.add("**/liborganicmaps.so")
        }
    }

    onVariants(selector().withBuildType("profileable")) { variant ->
        variant.packaging.jniLibs.keepDebugSymbols.add("**/liborganicmaps.so")
    }

    onVariants(selector().all()) { variant ->
        variant.buildConfigFields.put('FILE_PROVIDER_AUTHORITY',
                new BuildConfigField("String", "\"com.srpro.roaddash.provider\"", null))

        variant.manifestPlaceholders.put("FILE_PROVIDER_PLACEHOLDER", "com.srpro.roaddash.provider")

        variant.resValues.put(
                variant.makeResValueKey("string", "app_id"),
                new ResValue("com.srpro.roaddash", null))
    }
}